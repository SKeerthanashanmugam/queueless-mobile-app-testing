name: Repository quality checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON and Python syntax
        run: |
          python -m json.tool api/QueueLess.postman_collection.json > /dev/null
          python -m json.tool api/QueueLess.local.postman_environment.json > /dev/null
          python -m json.tool automation/config.json > /dev/null
          python -m compileall -q automation
      - name: Validate test case count and required fields
        run: |
          python scripts/validate_test_assets.py

